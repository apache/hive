name: Build and publish docker image for Hive CI Jenkins
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  buildPushJenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push Jenkins image to docker hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dev-support/docker/ci/jenkins/
          file: ./dev-support/docker/ci/jenkins/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ github.repository_owner }}/hive-ci-jenkins:lts-jdk25
