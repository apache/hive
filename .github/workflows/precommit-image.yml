# Builds the precommit image (dev-support/docker/precommit) and smoke tests it. On master it
# publishes the image as apache/hive:precommit, the image the Jenkinsfile runs in.
name: Precommit image

on:
  pull_request:
    paths:
      - 'dev-support/docker/precommit/**'
      - '.github/workflows/precommit-image.yml'
  push:
    branches:
      - master
    paths:
      - 'dev-support/docker/precommit/**'
      - '.github/workflows/precommit-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish; use a custom one (e.g. precommit-candidate-HIVE-12345) to try an image with the IMAGE parameter of the precommit job'
        required: true
        default: 'precommit'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ github.repository_owner }}/hive:${{ github.event.inputs.tag || 'precommit' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dev-support/docker/precommit/
          load: true
          tags: hive-precommit:test

      - name: Smoke test the image
        run: |
          docker images hive-precommit:test
          dev-support/docker/precommit/smoke-test.sh hive-precommit:test

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.repository == 'apache/hive'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the image
        if: github.event_name != 'pull_request' && github.repository == 'apache/hive'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dev-support/docker/precommit/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
