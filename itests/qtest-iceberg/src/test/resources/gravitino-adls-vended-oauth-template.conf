gravitino.iceberg-rest.httpPort = HTTP_PORT

# --- Iceberg REST Catalog Backend (JDBC for catalog metadata) ---
gravitino.iceberg-rest.catalog-backend = jdbc
gravitino.iceberg-rest.uri = jdbc:h2:file:/tmp/gravitino_h2_db;AUTO_SERVER=TRUE
gravitino.iceberg-rest.jdbc-driver = org.h2.Driver
gravitino.iceberg-rest.jdbc-user = sa
gravitino.iceberg-rest.jdbc-password = ""
gravitino.iceberg-rest.jdbc-initialize = true

# --- Warehouse on Azurite WASB + credential vending (azure-account-key) ---
# Azurite exposes blob storage only; use wasb:// against the blob endpoint (not abfss:// DFS).
# Iceberg 1.11 ResolvingFileIO routes wasb:// to ADLSFileIO (Azure SDK), which does not work with
# Azurite; use HadoopFileIO + hadoop-azure instead (same pattern as S3FileIO on the S3 test).
# Gravitino 1.0.0 ships Hadoop 2.10.2; hadoop-azure 2.10.2 is copied into the container
# (see TestIcebergRESTCatalogGravitinoAdlsLlapLocalCliDriver).
gravitino.iceberg-rest.warehouse = wasb://CONTAINER@ACCOUNT.blob.core.windows.net/warehouse
gravitino.iceberg-rest.io-impl = org.apache.iceberg.hadoop.HadoopFileIO
gravitino.iceberg-rest.credential-providers = azure-account-key
gravitino.iceberg-rest.azure-storage-account-name = ACCOUNT
gravitino.iceberg-rest.azure-storage-account-key = ACCOUNT_KEY
gravitino.iceberg-rest.fs.wasb.impl = org.apache.hadoop.fs.azure.NativeAzureFileSystem
gravitino.iceberg-rest.fs.wasbs.impl = org.apache.hadoop.fs.azure.NativeAzureFileSystem$Secure
gravitino.iceberg-rest.fs.AbstractFileSystem.wasb.impl = org.apache.hadoop.fs.azure.Wasb
gravitino.iceberg-rest.fs.azure = org.apache.hadoop.fs.azure.NativeAzureFileSystem
gravitino.iceberg-rest.fs.azure.storage.emulator.account.name = ACCOUNT.blob.core.windows.net
gravitino.iceberg-rest.fs.azure.account.key.ACCOUNT.blob.core.windows.net = ACCOUNT_KEY

# --- OAuth2 Authentication (catalog HTTP API) ---
gravitino.authenticators = oauth

gravitino.authenticator.oauth.serverUri = OAUTH2_SERVER_URI
gravitino.authenticator.oauth.tokenPath = /protocol/openid-connect/token
gravitino.authenticator.oauth.clientId = OAUTH2_CLIENT_ID
gravitino.authenticator.oauth.scope = openid catalog
gravitino.authenticator.oauth.clientSecret = OAUTH2_CLIENT_SECRET

gravitino.authenticator.oauth.tokenValidatorClass = org.apache.gravitino.server.authentication.JwksTokenValidator
gravitino.authenticator.oauth.jwksUri = OAUTH2_JWKS_URI/protocol/openid-connect/certs
gravitino.authenticator.oauth.provider = default
gravitino.authenticator.oauth.principalFields = sub
gravitino.authenticator.oauth.allowSkewSecs = 60
gravitino.authenticator.oauth.serviceAudience = hive-metastore
