# Routes all tez-yarn-it test logging to a file so StartTezYarnCluster's System.out
# banner is the only thing on the console. The log file path is supplied by the surefire
# argLine (-Dtez.yarn.it.log.file); when unset (e.g. running from an IDE) it falls back
# to target/tez-yarn-it.log.

status = warn
name = TezYarnItTestLogging

appender.file.type = File
appender.file.name = FILE
appender.file.fileName = ${sys:tez.yarn.it.log.file:-target/tez-yarn-it.log}
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{ISO8601} %-5p [%t] %c{2}: %m%n

rootLogger.level = info
rootLogger.appenderRef.file.ref = FILE
