# HDFS + YARN cluster for tez-yarn-it. Image built by TezYarnClusterContainer; config via env_file.

services:
  namenode:
    image: hive-it-hadoop-jdk21:latest
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file:
      - config
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
    ports:
      - "8020:8020"
      - "9870:9870"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9870'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  datanode:
    image: hive-it-hadoop-jdk21:latest
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file:
      - config
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9866:9866"
      - "9864:9864"

  resourcemanager:
    image: hive-it-hadoop-jdk21:latest
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    env_file:
      - config
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "8032:8032"
      - "8088:8088"
    # No healthcheck: RM webapp binds to hostname "resourcemanager", not localhost.

  nodemanager:
    image: hive-it-hadoop-jdk21:latest
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    env_file:
      - config
    depends_on:
      resourcemanager:
        condition: service_started
    ports:
      - "41000:41000"
